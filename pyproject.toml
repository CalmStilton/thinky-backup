[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thinky-backup"
version = "0.1.0"
description = "restic backups with consistent SQLite copies, freshness checks, restore drills and Uptime Kuma push reporting"
requires-python = ">=3.12"

[project.scripts]
thinky-backup = "thinky_backup.cli:main"

[tool.setuptools]
packages = ["thinky_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
